services:
  receiptsplit:
    image: receiptsplit
    build:
      # Built straight from GitHub, so deploying needs only this file and a .env. The repository is private: put a
      # GitHub token that can read it (a fine-grained token with Contents: read) in RECEIPTSPLIT_GITHUB_TOKEN.
      # Set RECEIPTSPLIT_SOURCE=. to build a local checkout instead.
      context: ${RECEIPTSPLIT_SOURCE:-https://github.com/qe201020335/ReceiptSplit.git#master}
      dockerfile: ReceiptSplit/Dockerfile
      # Passed as a build secret rather than written into the URL, so the token stays out of the image metadata.
      secrets:
        - GIT_AUTH_TOKEN
    ports:
      - "${RECEIPTSPLIT_PORT:-8080}:8080"
    environment:
      # Set these in a .env file next to this compose file (gitignored).
      Llm__BaseUrl: ${LLM_BASE_URL:-http://192.168.1.250:8000}
      Llm__ApiKey: ${LLM_API_KEY:-}
    # Runs as your user so the app can write to the data folder below; find your ids with `id -u` and `id -g`.
    user: "${RECEIPTSPLIT_UID:-1000}:${RECEIPTSPLIT_GID:-1000}"
    volumes:
      # The SQLite database and uploaded photos. Create the folder before the first start, or Docker creates it
      # owned by root and the app can't write to it.
      - ${RECEIPTSPLIT_DATA:-./data}:/app/data
    restart: unless-stopped

secrets:
  GIT_AUTH_TOKEN:
    environment: RECEIPTSPLIT_GITHUB_TOKEN
