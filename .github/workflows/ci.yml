name: CI

on:
  push:
    branches: [master]
    # Only version tags (v1.2.3, v1.2.3-rc.1): the image's tags come from the version, so any other tag would publish
    # an image with none.
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
    paths-ignore:
      - '*.md' # ignore top level md file changes
      - 'openspec/**'
      - '.claude/**'
  pull_request:
  workflow_dispatch:

# A newer push to a pull request cancels the run for the older one, so pr-<number> never goes back to an older commit.
# The image cleanup joins the same group, so a run still going when the pull request closes can't push after it.
# Runs for a branch or a tag go one at a time in the order they were pushed, so latest always ends on master's newest
# build and two prune jobs never overlap; a run still waiting is replaced by a newer one.
concurrency:
  group: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # Pull requests from this repository's branches publish pr-<number> for testing in staging. Those from forks get a
  # read-only token, so they only build.
  PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The server project references the client's esproj, so restoring it runs npm install and needs Node.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: receiptsplit.client/package-lock.json

      # Installs the SDK global.json asks for.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # GitHub Actions sets CI=true, which Directory.Build.props turns into warnings as errors.
      - run: dotnet build ReceiptSplit.slnx -c Release

      # Live model tests stay opt-in, and the sample receipts are not in the repository, so those tests skip.
      - run: dotnet test -c Release --no-build

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: receiptsplit.client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: receiptsplit.client/package-lock.json

      - run: npm ci

      # tsc -b type checks, then Vite builds.
      - run: npm run build

      - run: npm run lint

  image:
    # No point publishing an image the tests reject.
    needs: [backend, client]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # A pull request's image is built from its head commit rather than GitHub's merge commit, which exists only
      # for the run, so its sha-<commit> tag names a commit that can be found.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        env:
          # The sha-<commit> tag and the revision label name the pull request's head commit too.
          DOCKER_METADATA_PR_HEAD_SHA: true
        with:
          images: ${{ env.IMAGE }}
          # latest follows master and a pull request publishes pr-<number>; those and every other build are also
          # tagged sha-<commit>, so any image can be traced to its commit. A v1.2.3 git tag publishes 1.2.3 and 1.2
          # instead, since the version already names the commit, and the prune job never deletes it.
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,enable=${{ github.ref_type != 'tag' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          # Links the package to this repository, which also gives it the repository's readme.
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  prune:
    # Keeps the package to the last few master builds and the images other tags still name.
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # A workflow can delete versions of a package it published: the repository gets the package's admin role.
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      KEEP: 10
    steps:
      # master's history tells its builds apart from the other images tagged only sha-<commit>.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # An image left with only its sha-<commit> tag is kept if it is one of the newest master builds, and otherwise
      # deleted: older master builds, older pushes to pull requests and older runs on other branches. Each tag names
      # an image index, whose platform image and provenance are untagged versions of their own, so every untagged
      # version no kept index lists goes too. Anything updated in the last hour may be a build still pushing, so it
      # stays.
      - run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          versions="/users/$GITHUB_REPOSITORY_OWNER/packages/container/${image##*/}/versions"
          # The pull request cleanup and the prune job can overlap, so a version already deleted counts as done.
          delete() {
            local error
            if ! error=$(gh api -X DELETE "$versions/$1" 2>&1 > /dev/null < /dev/null); then
              [[ $error == *'(HTTP 404)'* ]] || { echo "$error" >&2; return 1; }
            fi
          }

          # id, digest, created, updated, tags
          gh api --paginate "$versions" \
            --jq '.[] | [.id, .name, .created_at, .updated_at, (.metadata.container.tags | join(","))] | @tsv' \
            > versions.tsv

          # metadata-action's sha-<commit> tags use the first seven characters.
          git rev-list --first-parent HEAD | cut -c1-7 | sed 's/^/sha-/' > master.txt
          # Adds whether a version is a master build, and whether sha-<commit> is all it is tagged.
          awk -F '\t' -v OFS='\t' 'FILENAME == ARGV[1] { master[$1]; next } {
            n = split($5, t, ","); build = 0; shaonly = n > 0
            for (i = 1; i <= n; i++) { if (t[i] in master) build = 1; if (t[i] !~ /^sha-/) shaonly = 0 }
            print $0, build, shaonly
          }' master.txt versions.tsv > classified.tsv
          {
            awk -F '\t' '$6' classified.tsv | sort -t $'\t' -k3,3r | tail -n +$((KEEP + 1)) | awk -F '\t' '$7'
            awk -F '\t' '!$6 && $7' classified.tsv
          } | cut -f 1-5 > old.tsv

          awk -F '\t' 'FILENAME == ARGV[1] { old[$1]; next } $5 != "" && !($1 in old) { print $2 }' \
            old.tsv versions.tsv > kept.txt
          while read -r digest; do
            docker buildx imagetools inspect --raw "$image@$digest" < /dev/null | jq -r '.manifests[]?.digest'
          done < kept.txt > children.txt
          cat children.txt >> kept.txt

          cutoff=$(date -u -d '1 hour ago' +%Y-%m-%dT%H:%M:%SZ)
          awk -F '\t' -v cutoff="$cutoff" \
            'FILENAME == ARGV[1] { kept[$1]; next } $5 == "" && $4 < cutoff && !($2 in kept)' \
            kept.txt versions.tsv > orphans.tsv

          failed=0
          while IFS=$'\t' read -r id digest _ _ tags; do
            echo "Deleting $digest${tags:+ ($tags)}"
            delete "$id" || failed=1
          done < <(cat old.tsv orphans.tsv)
          exit "$failed"
