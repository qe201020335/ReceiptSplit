name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
    paths-ignore:
      - '*.md' # ignore top level md file changes
      - 'openspec/**'
      - '.claude/**'
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The server project references the client's esproj, so restoring it runs npm install and needs Node.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: receiptsplit.client/package-lock.json

      # Installs the SDK global.json asks for.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # GitHub Actions sets CI=true, which Directory.Build.props turns into warnings as errors.
      - run: dotnet build ReceiptSplit.slnx -c Release

      # Live model tests stay opt-in, and the sample receipts are not in the repository, so those tests skip.
      - run: dotnet test -c Release --no-build

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: receiptsplit.client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: receiptsplit.client/package-lock.json

      - run: npm ci

      # tsc -b type checks, then Vite builds.
      - run: npm run build

      - run: npm run lint

  image:
    # No point publishing an image the tests reject.
    needs: [backend, client]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Pull requests from forks get a read-only token, and nothing is pushed for them anyway.
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # latest follows master; a v1.2.3 tag also publishes 1.2.3 and 1.2.
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/ReceiptSplit/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          # Links the package to this repository, which also gives it the repository's readme.
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
