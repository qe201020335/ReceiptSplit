name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
    paths-ignore:
      - '*.md' # ignore top level md file changes
      - 'openspec/**'
      - '.claude/**'
  pull_request:
  workflow_dispatch:

# A newer push to a pull request cancels the run for the older one, so pr-<number> never goes back to an older commit.
# The image cleanup joins the same group, so a run still going when the pull request closes can't push after it. Other
# events get a group of their own and are never cancelled.
concurrency:
  group: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # Pull requests from this repository's branches publish pr-<number> for testing in staging. Those from forks get a
  # read-only token, so they only build.
  PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The server project references the client's esproj, so restoring it runs npm install and needs Node.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: receiptsplit.client/package-lock.json

      # Installs the SDK global.json asks for.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # GitHub Actions sets CI=true, which Directory.Build.props turns into warnings as errors.
      - run: dotnet build ReceiptSplit.slnx -c Release

      # Live model tests stay opt-in, and the sample receipts are not in the repository, so those tests skip.
      - run: dotnet test -c Release --no-build

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: receiptsplit.client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: receiptsplit.client/package-lock.json

      - run: npm ci

      # tsc -b type checks, then Vite builds.
      - run: npm run build

      - run: npm run lint

  image:
    # No point publishing an image the tests reject.
    needs: [backend, client]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # latest follows master, and every master build keeps sha-<commit> for rolling back. A pull request
          # publishes pr-<number>, and a v1.2.3 tag also publishes 1.2.3 and 1.2.
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          # Links the package to this repository, which also gives it the repository's readme.
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  prune:
    # Keeps the package to the last few master builds and the other tagged images.
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      # A workflow can delete versions of a package it published: the repository gets the package's admin role.
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      KEEP: 10
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each tag names an image index, whose platform image and provenance are untagged versions of their own. So
      # every untagged version that no kept index lists goes too: the pieces of the master builds deleted here, and
      # older pushes to pull requests. Anything updated in the last hour may be a build still pushing, so it stays.
      - run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          versions="/users/$GITHUB_REPOSITORY_OWNER/packages/container/${image##*/}/versions"

          # id, digest, created, updated, tags
          gh api --paginate "$versions" \
            --jq '.[] | [.id, .name, .created_at, .updated_at, (.metadata.container.tags | join(","))] | @tsv' \
            > versions.tsv

          # Master builds past the newest $KEEP, unless they also carry a tag such as latest.
          awk -F '\t' '$5 ~ /(^|,)sha-/' versions.tsv | sort -t $'\t' -k3,3r | tail -n +$((KEEP + 1)) \
            | awk -F '\t' '{ n = split($5, t, ","); for (i = 1; i <= n; i++) if (t[i] !~ /^sha-/) next; print }' \
            > old.tsv

          awk -F '\t' 'FILENAME == ARGV[1] { old[$1]; next } $5 != "" && !($1 in old) { print $2 }' \
            old.tsv versions.tsv > kept.txt
          while read -r digest; do
            docker buildx imagetools inspect --raw "$image@$digest" < /dev/null | jq -r '.manifests[]?.digest'
          done < kept.txt > children.txt
          cat children.txt >> kept.txt

          cutoff=$(date -u -d '1 hour ago' +%Y-%m-%dT%H:%M:%SZ)
          awk -F '\t' -v cutoff="$cutoff" \
            'FILENAME == ARGV[1] { kept[$1]; next } $5 == "" && $4 < cutoff && !($2 in kept)' \
            kept.txt versions.tsv > orphans.tsv

          failed=0
          while IFS=$'\t' read -r id digest _ _ tags; do
            echo "Deleting $digest${tags:+ ($tags)}"
            gh api -X DELETE "$versions/$id" > /dev/null < /dev/null || failed=1
          done < <(cat old.tsv orphans.tsv)
          exit "$failed"
