name: Delete PR image

# CI publishes pr-<number> for every push to a pull request from this repository; once the pull request is merged or
# closed, nothing deploys it any more.
on:
  pull_request:
    types: [closed]

# The same group as CI's run for this pull request, so a run still going is cancelled before it can push again.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  delete:
    # Pull requests from forks never publish an image.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      # A workflow can delete versions of a package it published: the repository gets the package's admin role.
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: pr-${{ github.event.pull_request.number }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tag names an image index; its platform image and provenance are untagged versions of their own, left
      # behind unless they're deleted by digest too. Other images' children are untagged as well, so only this
      # index's are deleted.
      - run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          versions="/users/$GITHUB_REPOSITORY_OWNER/packages/container/${image##*/}/versions"

          gh api --paginate "$versions" --jq '.[] | [.id, .name, (.metadata.container.tags | join(","))] | @tsv' \
            > versions.tsv
          tagged=$(awk -F '\t' -v tag="$TAG" '{ n = split($3, t, ","); for (i = 1; i <= n; i++) if (t[i] == tag) print }' \
            versions.tsv)
          if [ -z "$tagged" ]; then
            echo "There is no $TAG image."
            exit 0
          fi
          IFS=$'\t' read -r id digest tags <<< "$tagged"
          if [ "$tags" != "$TAG" ]; then
            echo "::warning::$digest is also tagged $tags, so it was kept."
            exit 0
          fi

          children=$(docker buildx imagetools inspect --raw "$image:$TAG" | jq -r '.manifests[]?.digest')
          echo "Deleting $TAG ($digest)"
          gh api -X DELETE "$versions/$id"
          for child in $children; do
            child_id=$(awk -F '\t' -v digest="$child" '$2 == digest && $3 == "" { print $1 }' versions.tsv)
            if [ -n "$child_id" ]; then
              echo "Deleting $child"
              gh api -X DELETE "$versions/$child_id"
            fi
          done
