name: Delete PR image

# CI publishes pr-<number> for every push to a pull request from this repository; once the pull request is merged or
# closed, nothing deploys it any more.
on:
  pull_request:
    types: [closed]

# The same group as CI's run for this pull request, so a run still going is cancelled before it can push again.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  delete:
    # Pull requests from forks never publish an image.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # A workflow can delete versions of a package it published: the repository gets the package's admin role.
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: pr-${{ github.event.pull_request.number }}
    steps:
      # The script from the default branch: GitHub's merge commit for a closed pull request may already be gone.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: .github/scripts/delete-pr-image.sh "$TAG"
